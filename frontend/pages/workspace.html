<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureIssueHub - Workspace</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light">
  <nav class="navbar navbar-light bg-white border-bottom">
    <div class="container">
      <a href="./dashboard.html" class="navbar-brand">← Dashboard</a>
      <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Odhlásiť sa</button>
    </div>
  </nav>

  <div class="container py-4">
    <h1 class="h3 mb-4">Issues</h1>

    <div id="errorBox" class="alert alert-danger d-none"></div>

    <div class="card mb-4">
      <div class="card-body">
        <form id="issueForm" class="row g-3">
          <div class="col-12">
            <input id="title" class="form-control" placeholder="Názov issue" required />
          </div>
          <div class="col-12">
            <textarea id="description" class="form-control" rows="4" placeholder="Popis"></textarea>
          </div>
          <div class="col-md-4">
            <select id="severity" class="form-select">
              <option value="LOW">LOW</option>
              <option value="MEDIUM" selected>MEDIUM</option>
              <option value="HIGH">HIGH</option>
              <option value="CRITICAL">CRITICAL</option>
            </select>
          </div>
          <div class="col-md-8">
            <button class="btn btn-primary w-100" type="submit">Vytvoriť issue</button>
          </div>
        </form>
      </div>
    </div>

    <div id="issuesList" class="row g-3"></div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/workspace.js"></script>
</body>
</html>
