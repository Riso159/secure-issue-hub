<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureIssueHub - Dashboard</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light">
  <nav class="navbar navbar-light bg-white border-bottom">
    <div class="container">
      <span class="navbar-brand mb-0 h1">SecureIssueHub</span>
      <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Odhlásiť sa</button>
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3 mb-0">Moje workspaces</h1>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <form id="workspaceForm" class="row g-2">
          <div class="col-md-9">
            <input id="workspaceName" class="form-control" placeholder="Názov workspace" required />
          </div>
          <div class="col-md-3">
            <button class="btn btn-primary w-100" type="submit">Vytvoriť</button>
          </div>
        </form>
      </div>
    </div>

    <div id="errorBox" class="alert alert-danger d-none"></div>
    <div id="workspaceList" class="list-group"></div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/dashboard.js"></script>
</body>
</html>
