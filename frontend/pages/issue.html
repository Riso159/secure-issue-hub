<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureIssueHub - Issue detail</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light">
  <nav class="navbar navbar-light bg-white border-bottom">
    <div class="container">
      <a id="backLink" href="./dashboard.html" class="navbar-brand">← Späť</a>
      <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Odhlásiť sa</button>
    </div>
  </nav>

  <div class="container py-4">
    <div id="errorBox" class="alert alert-danger d-none"></div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start mb-3">
          <div>
            <h1 id="issueTitle" class="h3 mb-2">Issue</h1>
            <p id="issueMeta" class="text-muted mb-0"></p>
          </div>
          <span id="issueSeverity" class="badge bg-dark">MEDIUM</span>
        </div>

        <p id="issueDescription" class="mb-4"></p>

        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label class="form-label">Status</label>
            <select id="statusSelect" class="form-select">
              <option value="OPEN">OPEN</option>
              <option value="IN_PROGRESS">IN_PROGRESS</option>
              <option value="RESOLVED">RESOLVED</option>
              <option value="CLOSED">CLOSED</option>
            </select>
          </div>
          <div class="col-md-4">
            <button id="saveStatusBtn" class="btn btn-primary w-100">
              Uložiť status
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h4 mb-3">Komentáre</h2>

        <form id="commentForm" class="mb-4">
          <div class="mb-3">
            <textarea
              id="commentContent"
              class="form-control"
              rows="4"
              placeholder="Napíš komentár..."
              required
            ></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Pridať komentár</button>
        </form>

        <div id="commentsList" class="d-flex flex-column gap-3"></div>
      </div>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/issue.js"></script>
</body>
</html>
